[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-dream"
version = "0.1.0"
description = "CLV-validated probabilistic racing-market engine for NZ/AU"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["the_dream*"]

[tool.pytest.ini_options]
testpaths = ["the_dream/tests"]
pythonpath = ["."]
